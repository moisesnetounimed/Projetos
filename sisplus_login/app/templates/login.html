<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>SISPLUS - Unimed Sorocaba</title>
  <link rel="icon" href="https://www.unimedsorocaba.coop.br/repositorio/imagens/icones/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/login.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>

  <!-- HEADER -->
  <header class="top-header">
    <div class="header-content">
      <img src="/static/img/logo-unimed.png" alt="Unimed Sorocaba">
      <span class="logo-divider" aria-hidden="true"></span>
      <h2>SISPLUS - Unimed Sorocaba</h2>
    </div>
  </header>

  <!-- LOGIN -->
  <main class="login-wrapper">
    <div class="login-card">

      <img src="/static/img/logo-unimed.png" alt="Unimed Sorocaba">
      <p class="subtitle">Insira suas credenciais de acesso</p>

      {% if error %}
      <div class="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">

        <div class="input-group">
          <i class="fa fa-user"></i>
          <input type="text" name="username" placeholder="Usuário" required>
        </div>

        <div class="input-group">
          <i class="fa fa-lock"></i>
          <input type="password" name="password" placeholder="Senha" required>
          <i class="fa fa-eye toggle-password"></i>
        </div>

        <div class="login-options">
          <label>
            <input type="checkbox"> Lembrar-me
          </label>
        </div>

        <button type="submit" class="btn-login">ENTRAR</button>
      </form>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="copyright">
      © Unimed Sorocaba 2026 | Todos os dreitos reservados | CNPJ: 45.399.961/001-59
    </div>
  </footer>

  <script>
    document.querySelector(".toggle-password").addEventListener("click", function () {
      const input = this.previousElementSibling;
      input.type = input.type === "password" ? "text" : "password";
    });
  </script>

</body>

</html>
